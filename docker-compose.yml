services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rentivo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/rentivo
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  ui:
    build:
      context: ../rentivo-ui
    ports:
      - "5173:5173"
    volumes:
      - ../rentivo-ui:/app
      - ui_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
  ui_node_modules:
